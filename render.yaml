        value: postgresql://neondb_owner:npg_4HJCtmufY7Wc@ep-dawn-dawn-ac8q1uef-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: DATABASE_URL_DIRECT
        value: postgresql://neondb_owner:npg_4HJCtmufY7Wc@ep-dawn-dawn-ac8q1uef.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
